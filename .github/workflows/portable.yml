name: Portable exe
# Runs the real portable exe (NSIS launcher -> %TEMP% -> Electron) on a clean runner:
# locally Smart App Control blocks unsigned builds. Builds only, publishes nothing.
on:
  push:
    branches: ['verify/portable-exe']
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win portable --publish never
      - name: Checksum
        shell: bash
        run: sha256sum dist/learnaing-*-portable.exe
      - name: Run the real portable exe
        shell: bash
        run: PORTABLE_EXE="$(ls dist/learnaing-*-portable.exe)" npx playwright test portable --reporter=list
      - name: Chromium logs of the exe runs
        if: always()
        shell: bash
        run: tail -n +1 test-results/*/chromium-*.log || true
