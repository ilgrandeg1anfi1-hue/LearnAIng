name: Release
# Pushing a tag v* builds the installer and portable exe on a clean runner and publishes a pre-release.
# Release binaries are built only here, never on a personal machine (required by SignPath).
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      # --publish never: electron-builder must not upload anything by itself
      - run: npx electron-builder --win --publish never
      - name: Checksums
        shell: bash
        run: cd dist && sha256sum learnaing-*-setup.exe learnaing-*-portable.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/learnaing-*-setup.exe dist/learnaing-*-portable.exe dist/SHA256SUMS.txt \
            --prerelease --title "LearnAIng $TAG (preview, unsigned)" \
            --notes "Early preview built by GitHub Actions from this tag. Not code-signed yet: Windows shows 'Unknown publisher' (More info -> Run anyway); Smart App Control may block it. Verify downloads with SHA256SUMS.txt."
